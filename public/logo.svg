<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Definitions for Gradients and Filters -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Leaf Core Gradient (Biology/Nature) -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />   <!-- Emerald 400 -->
      <stop offset="100%" stop-color="#059669" />  <!-- Emerald 600 -->
    </linearGradient>

    <!-- Tech/Engineering Gradient (Physics/Math) -->
    <linearGradient id="techGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />    <!-- Blue 400 -->
      <stop offset="100%" stop-color="#2563eb" />  <!-- Blue 600 -->
    </linearGradient>
    
    <!-- Accent Gradient (Chemistry/Energy) -->
    <linearGradient id="accentGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#fbbf24" />    <!-- Amber 400 -->
      <stop offset="100%" stop-color="#d97706" />  <!-- Amber 600 -->
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Inner Shadow Filter -->
    <filter id="innerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.3" flood-color="#000"/>
    </filter>
  </defs>

  <!-- Background (Optional, provides dark mode context natively) -->
  <!-- <rect width="500" height="500" rx="100" fill="url(#bgGrad)" /> -->

  <!-- Outer Ring (The Cycle of Nature & Math) -->
  <g transform="translate(250, 250)">
    <!-- Tech Orbit -->
    <circle cx="0" cy="0" r="180" fill="none" stroke="url(#techGrad)" stroke-width="4" stroke-dasharray="15 30" opacity="0.6" stroke-linecap="round" />
    
    <!-- Organic Orbit -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="url(#leafGrad)" stroke-width="2" stroke-dasharray="70 20" opacity="0.8" stroke-linecap="round" />
  </g>

  <!-- Central Composition -->
  <g transform="translate(250, 250)">
    
    <!-- The Gear (Engineering Foundation) -->
    <g fill="url(#techGrad)" opacity="0.15" filter="url(#glow)">
        <path d="M 120 0 L 140 15 L 130 40 L 105 45 Z" />
        <path d="M 85 85 L 105 105 L 85 125 L 60 110 Z" />
        <path d="M 0 120 L 15 140 L -15 140 L -15 110 Z" />
        <path d="M -85 85 L -105 105 L -125 85 L -110 60 Z" />
        <path d="M -120 0 L -140 -15 L -130 -40 L -105 -45 Z" />
        <path d="M -85 -85 L -105 -105 L -85 -125 L -60 -110 Z" />
        <path d="M 0 -120 L -15 -140 L 15 -140 L 15 -110 Z" />
        <path d="M 85 -85 L 105 -105 L 125 -85 L 110 -60 Z" />
        
        <!-- Gear Main Body -->
        <circle cx="0" cy="0" r="110" fill="none" stroke="url(#techGrad)" stroke-width="25" />
    </g>

    <!-- The Diamond / Polygon (Math & Structure) -->
    <polygon points="0,-130 110,0 0,130 -110,0" fill="none" stroke="url(#techGrad)" stroke-width="6" opacity="0.5" stroke-linejoin="round"/>
    
    <!-- Inner Structural Hexagon (Chemistry/Molecules) -->
    <polygon points="0,-90 78,-45 78,45 0,90 -78,45 -78,-45" fill="none" stroke="url(#accentGrad)" stroke-width="4" opacity="0.7" stroke-linejoin="round"/>

    <!-- 
      The Main Symbol: A Sprout/Leaf merging with a Book/Ruler 
      EdTech + AgTech 
    -->
    <g filter="url(#glow)">
      
      <!-- Right Side: The Geometry / Precision (Blue Drop/Glass) -->
      <path d="M 0,-70 C 60,-30 80,30 50,70 C 20,110 0,120 0,120 C 0,120 0,0 0,-70 Z" fill="url(#techGrad)" opacity="0.9" />
      
      <!-- Left Side: The Leaf / Nature (Green Sprout) -->
      <path d="M 0,-100 C -70,-50 -90,20 -50,60 C -15,95 0,120 0,120 C 0,120 0,0 0,-100 Z" fill="url(#leafGrad)" opacity="0.95" />
      
      <!-- Center Split / Stem -->
      <path d="M 0,-100 L 0,120" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
      
      <!-- Leaf Veins / Data Nodes -->
      <g stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none">
        <!-- Left (Nature) Veins - Curved like a leaf -->
        <path d="M 0,-20 Q -30,-30 -50,-20" />
        <path d="M 0,20 Q -30,10 -50,25" />
        <path d="M 0,60 Q -20,55 -35,65" />
        
        <!-- Right (Tech) Veins - Straight / Geometric / Circuit-like -->
        <polyline points="0,-10 30,-20 40,-10" />
        <polyline points="0,30 25,25 35,40" />
        <polyline points="0,70 15,65 25,80" />
      </g>
      
      <!-- Data Nodes (Chemistry dots) -->
      <circle cx="40" cy="-10" r="5" fill="#fbbf24" />
      <circle cx="35" cy="40" r="5" fill="#fbbf24" />
      <circle cx="25" cy="80" r="5" fill="#fbbf24" />
    </g>

    <!-- Central Focus Point (Seed of Knowledge) -->
    <circle cx="0" cy="120" r="12" fill="#ffffff" filter="url(#glow)"/>
    <circle cx="0" cy="120" r="6" fill="#059669" />

  </g>
</svg>
